routes:
  - id: r_orders_list
    path: /api/v1/orders
    method: GET
    upstream: https://jsonplaceholder.typicode.com/posts
    enabled: true
    requireAuth: false
    requireIdempotency: false
    roles: []
    rateLimit:
      limit: 100
      windowSec: 60
    timeoutMs: 5000

  - id: r_orders_get
    path: /api/v1/orders/:id
    method: GET
    upstream: https://jsonplaceholder.typicode.com/posts
    enabled: true
    requireAuth: false
    requireIdempotency: false
    roles: []
    rateLimit:
      limit: 200
      windowSec: 60
    timeoutMs: 5000

  - id: r_users_list
    path: /api/v1/users
    method: GET
    upstream: https://jsonplaceholder.typicode.com/users
    enabled: true
    requireAuth: false
    requireIdempotency: false
    roles: []
    rateLimit:
      limit: 100
      windowSec: 60
    timeoutMs: 5000

  - id: r_legacy_wildcard
    path: /api/v1/legacy/*
    method: ALL
    upstream: https://jsonplaceholder.typicode.com
    enabled: false
    requireAuth: false
    requireIdempotency: false
    roles: []
    timeoutMs: 5000
