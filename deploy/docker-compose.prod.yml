services:
  gateway:
    build:
      target: prod
    image: michishirube/gateway:${GATEWAY_TAG:?GATEWAY_TAG wajib di-set}
    ports:
      - '127.0.0.1:${GATEWAY_PORT:-7300}:7300'
      - '127.0.0.1:${GATEWAY_METRICS_PORT:-7301}:9464'
    environment:
      NODE_ENV: production
      PORT: 7300
      LOG_LEVEL: info
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:7300/health/ready']
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'

  redis:
    ports: []
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M

  prometheus:
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-7390}:9090'

  grafana:
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-7391}:3000'

  jaeger:
    ports:
      - '127.0.0.1:${JAEGER_UI_PORT:-7392}:16686'
