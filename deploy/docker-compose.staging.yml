services:
  gateway:
    build:
      target: staging
    image: api-gateway:staging
    ports:
      - '3000:3000'
      - '9464:9464'
    environment:
      NODE_ENV: staging
      LOG_LEVEL: debug
      RATE_LIMIT_MAX: 1000
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        max_attempts: 3

  redis:
    ports:
      - '6379:6379'
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
