services:
  gateway:
    build:
      target: staging
    image: michishirube/gateway:staging
    ports:
      - '${GATEWAY_PORT:-7300}:7300'
      - '${GATEWAY_METRICS_PORT:-7301}:9464'
    environment:
      NODE_ENV: staging
      PORT: 7300
      LOG_LEVEL: debug
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        max_attempts: 3

  redis:
    ports:
      - '${REDIS_PORT:-7380}:6379'

  prometheus:
    ports:
      - '${PROMETHEUS_PORT:-7390}:9090'

  grafana:
    ports:
      - '${GRAFANA_PORT:-7391}:3000'

  jaeger:
    ports:
      - '${JAEGER_UI_PORT:-7392}:16686'
      - '${OTEL_GRPC_PORT:-7317}:4317'
      - '${OTEL_HTTP_PORT:-7318}:4318'
