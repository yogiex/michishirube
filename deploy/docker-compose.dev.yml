services:
  gateway:
    build:
      target: dev
    image: michishirube/gateway:dev
    ports:
      - '${GATEWAY_PORT:-7300}:7300'
      - '${GATEWAY_DEBUG_PORT:-7329}:9229'
    volumes:
      - ../src:/app/src:delegated
      - ../test:/app/test:delegated
      - ../config:/app/config:delegated
      - ../package.json:/app/package.json:ro
      - ../tsconfig.json:/app/tsconfig.json:ro
      - gateway-node-modules:/app/node_modules
    environment:
      NODE_ENV: development
      PORT: 7300
      LOG_LEVEL: debug
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: pnpm start:dev
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G

  redis:
    ports:
      - '${REDIS_PORT:-7380}:6379'
    command: >
      redis-server
      --appendonly no
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    volumes: []

  redis-ui:
    image: rediscommander/redis-commander:latest
    container_name: michishirube-redis-ui
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD}
    ports:
      - '${REDIS_UI_PORT:-7381}:8081'
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - michishirube-net

  postgres:
    ports:
      - '${POSTGRES_PORT:-7383}:5432'

  pgbouncer:
    ports:
      - '${PGBOUNCER_PORT:-7382}:5432'

  prometheus:
    ports:
      - '${PROMETHEUS_PORT:-7390}:9090'

  grafana:
    ports:
      - '${GRAFANA_PORT:-7391}:3000'

  jaeger:
    ports:
      - '${JAEGER_UI_PORT:-7392}:16686'
      - '${OTEL_GRPC_PORT:-7317}:4317'
      - '${OTEL_HTTP_PORT:-7318}:4318'

volumes:
  gateway-node-modules:
    driver: local
