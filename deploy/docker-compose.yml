name: ${COMPOSE_PROJECT_NAME:-michishirube}

services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: prod
    image: michishirube/gateway:${GATEWAY_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 7300
      SERVICE_NAME: ${SERVICE_NAME:-michishirube}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    env_file:
      - ../.env.${NODE_ENV:-production}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - michishirube-net
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  redis:
    image: redis:${REDIS_TAG:-7-alpine}
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - michishirube-net

  pgbouncer:
    image: edoburu/pgbouncer:${PGBOUNCER_TAG:-latest}
    profiles: ['pg']
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - michishirube-net

  postgres:
    image: postgres:${POSTGRES_TAG:-16-alpine}
    profiles: ['pg']
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - michishirube-net

  prometheus:
    image: prom/prometheus:${PROMETHEUS_TAG:-latest}
    profiles: ['monitoring']
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - gateway
    networks:
      - michishirube-net

  grafana:
    image: grafana/grafana:${GRAFANA_TAG:-latest}
    profiles: ['monitoring']
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-7391}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - michishirube-net

  jaeger:
    image: jaegertracing/all-in-one:${JAEGER_TAG:-latest}
    profiles: ['tracing']
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
      JAEGER_DISABLED: 'false'
    networks:
      - michishirube-net

volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  michishirube-net:
    driver: bridge
